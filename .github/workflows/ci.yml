name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
        exclude:
          - os: macos-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Prepare ignored test workspace
        run: mkdir -p work
      - name: Run complete suite on Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q
      - name: Verify local MCP features on macOS and Linux
        if: runner.os != 'Windows'
        run: python -m pytest -q tests/test_service.py tests/test_server.py tests/test_estimation.py tests/test_sdk_coverage.py tests/test_food_benchmark.py tests/test_food_inference.py tests/test_cli.py
      - run: python -m ruff check src tests
      - run: python -m build
      - name: Check wheel contents exclude local data
        shell: bash
        run: python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); assert not any(n.startswith(('data/','work/')) for n in z.namelist())"
