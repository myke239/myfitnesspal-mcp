name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Assemble release assets
        run: |
          v="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="myfitnesspal-mcp-${v}/" "$GITHUB_SHA" > "dist/myfitnesspal-mcp-${v}-source.tar.gz"
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          (cd dist && sha256sum *.whl *.tar.gz install.sh install.ps1 > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "MyFitnessPal MCP ${GITHUB_REF_NAME#v}" --generate-notes
