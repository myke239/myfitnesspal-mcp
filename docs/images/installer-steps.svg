<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="t d"><title id="t">Installer and MCP configuration</title><desc id="d">Two panels show running the installer and entering the generated command and arguments into an MCP client.</desc><rect width="1100" height="600" fill="#f6f8fa"/><rect x="35" y="35" width="500" height="520" rx="14" fill="#0d1117"/><rect x="565" y="35" width="500" height="520" rx="14" fill="#fff" stroke="#d0d7de"/><text x="65" y="83" font-family="Arial" font-size="23" font-weight="700" fill="#fff">1 · Run the installer</text><text x="65" y="137" font-family="Consolas,monospace" font-size="18" fill="#7ee787">$ ./install.sh</text><text x="65" y="184" font-family="Consolas,monospace" font-size="16" fill="#e6edf3">Creating isolated environment…</text><text x="65" y="218" font-family="Consolas,monospace" font-size="16" fill="#e6edf3">Installing MyFitnessPal MCP…</text><text x="65" y="262" font-family="Consolas,monospace" font-size="16" fill="#7ee787">Installed successfully</text><text x="65" y="318" font-family="Consolas,monospace" font-size="14" fill="#e6edf3">Verify: ~/.local/share/myfitnesspal-mcp/</text><text x="65" y="344" font-family="Consolas,monospace" font-size="14" fill="#e6edf3">myfitnesspal-mcp verify --browser firefox</text><text x="595" y="83" font-family="Arial" font-size="23" font-weight="700" fill="#24292f">2 · Add an MCP server</text><text x="595" y="140" font-family="Arial" font-size="16" fill="#57606a">Command</text><rect x="595" y="153" width="440" height="57" rx="7" fill="#f6f8fa" stroke="#d0d7de"/><text x="612" y="188" font-family="Consolas,monospace" font-size="14" fill="#24292f">/absolute/path/to/python</text><text x="595" y="252" font-family="Arial" font-size="16" fill="#57606a">Arguments</text><rect x="595" y="265" width="440" height="57" rx="7" fill="#f6f8fa" stroke="#d0d7de"/><text x="612" y="300" font-family="Consolas,monospace" font-size="14" fill="#24292f">-m myfitnesspal_mcp.cli serve</text><text x="595" y="365" font-family="Arial" font-size="16" fill="#57606a">Environment</text><rect x="595" y="378" width="440" height="57" rx="7" fill="#f6f8fa" stroke="#d0d7de"/><text x="612" y="413" font-family="Consolas,monospace" font-size="14" fill="#24292f">MFP_BROWSER = firefox</text><text x="595" y="489" font-family="Arial" font-size="15" fill="#1a7f37">Save, restart the client, then reload tools.</text><text x="65" y="518" font-family="Arial" font-size="15" fill="#8b949e">Example only. Use the exact path printed on your computer.</text></svg>
