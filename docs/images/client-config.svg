<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="t d"><title id="t">Example MCP client server entry</title><desc id="d">Settings panel showing a local server name, Python command, arguments, environment variable, and save action.</desc><rect width="1100" height="560" fill="#f6f8fa"/><rect x="90" y="30" width="920" height="500" rx="16" fill="white" stroke="#d0d7de"/><text x="135" y="87" font-family="Arial" font-size="27" font-weight="700" fill="#24292f">Add local MCP server</text><text x="135" y="143" font-family="Arial" font-size="17" fill="#57606a">Name</text><rect x="135" y="157" width="830" height="50" rx="7" fill="#fff" stroke="#d0d7de"/><text x="155" y="189" font-family="Arial" font-size="17" fill="#24292f">MyFitnessPal</text><text x="135" y="249" font-family="Arial" font-size="17" fill="#57606a">Command (absolute path from the installer)</text><rect x="135" y="263" width="830" height="50" rx="7" fill="#fff" stroke="#d0d7de"/><text x="155" y="295" font-family="Consolas,monospace" font-size="16" fill="#24292f">/home/alex/.local/share/myfitnesspal-mcp/venv/bin/python</text><text x="135" y="355" font-family="Arial" font-size="17" fill="#57606a">Arguments</text><rect x="135" y="369" width="830" height="50" rx="7" fill="#fff" stroke="#d0d7de"/><text x="155" y="401" font-family="Consolas,monospace" font-size="16" fill="#24292f">-m myfitnesspal_mcp.cli serve</text><rect x="135" y="447" width="20" height="20" rx="4" fill="#1f883d"/><path d="M140 457l5 5 10-12" fill="none" stroke="white" stroke-width="3"/><text x="169" y="463" font-family="Arial" font-size="16" fill="#24292f">Environment variable MFP_BROWSER = firefox</text><rect x="815" y="478" width="150" height="38" rx="8" fill="#1f883d"/><text x="866" y="503" font-family="Arial" font-size="16" font-weight="700" fill="white">Save</text></svg>
